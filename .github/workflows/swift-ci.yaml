name: Swift CI

on:
  workflow_call:
    inputs:
      # ── Common ──────────────────────────────────────────────
      name:
        description: 'Package name (repository/directory identifier)'
        required: true
        type: string
      product-name:
        description: 'Product name (importable library name)'
        default: ''
        required: false
        type: string
      swift-version:
        description: 'Swift version for compilation and tests'
        default: '6.2'
        required: false
        type: string
      format-swift-version:
        description: 'Swift version for swift-format (can use latest)'
        default: '6.3'
        required: false
        type: string
      platform:
        default: 'macOS-26'
        required: false
        type: string
      debug:
        description: 'Verbose CI logs (bypasses `xcbeautify` entirely so raw xcodebuild output is kept)'
        default: false
        required: false
        type: boolean

      # ── Step 1: Header Validation ───────────────────────────
      enable-header-validation:
        description: 'Step 1 – Validate license header in *.swift files'
        default: false
        required: false
        type: boolean
      header-path:
        default: '.'
        required: false
        type: string
      header-template:
        description: 'Expected header block; each line is matched against the first lines of every *.swift file'
        default: ''
        required: false
        type: string
      header-use-regex:
        description: 'Treat each line of header-template as an extended regular expression instead of literal text'
        default: false
        required: false
        type: boolean

      # ── Step 2: Format ──────────────────────────────────────
      enable-format:
        description: 'Step 2 – Validate swift format'
        default: true
        required: false
        type: boolean
      format-path:
        default: '.'
        required: false
        type: string
      format-config:
        default: '.swift-format'
        required: false
        type: string

      # ── Step 3: Breaking Changes ────────────────────────────
      enable-breaking-changes:
        description: 'Step 3 – Check API breaking changes'
        default: false
        required: false
        type: boolean
      skip-on-major-update:
        default: true
        required: false
        type: boolean
      force-skip-breaking-changes:
        description: 'Force skip breaking changes check'
        default: false
        required: false
        type: boolean

      # ── Step 4: Apple Tests ─────────────────────────────────
      enable-apple-tests:
        description: 'Step 4 – Run Apple platform tests'
        default: false
        required: false
        type: boolean
      xcode-version:
        default: '26.6'
        required: false
        type: string
      package-name:
        default: ''
        required: false
        type: string
      apple-coverage-enabled:
        default: false
        required: false
        type: boolean
      apple-tests-parallel-testing-worker-count:
        description: >-
          Caps xcodebuild's simulator worker count for Step 4 Apple tests
          (`-parallel-testing-worker-count`). Empty (default) leaves Xcode's
          own default in place. Lower this if simulator destinations are
          flaking under CPU/scheduler contention on the runner.
        default: ''
        required: false
        type: string

      # ── Step 4: Third Party Tests ───────────────────────────
      enable-third-party-tests:
        description: 'Step 4 – Run third-party platform tests'
        default: false
        required: false
        type: boolean
      third-party-coverage-enabled:
        default: false
        required: false
        type: boolean

      # ── Step 4: Linkage Test (FoundationEssentials) ─────────
      enable-linkage-test:
        description: 'Step 4 – Run linkage test for FoundationEssentials (Linux only)'
        default: false
        required: false
        type: boolean

      # ── Step 4: Android Build ───────────────────────────────
      enable-android-build:
        description: 'Step 4 – Cross-compile the package for Android (build only, no test execution)'
        default: false
        required: false
        type: boolean
      android-swift-sdk:
        description: 'Swift SDK identifier passed to `swift build --swift-sdk` for the Android cross-compile'
        default: 'aarch64-unknown-linux-android28'
        required: false
        type: string
      android-toolchain-swift-version:
        description: 'Host Swift toolchain version to install (must match the Android SDK bundle major.minor)'
        default: '6.3'
        required: false
        type: string
      android-sdk-url:
        description: 'Download URL for the official swift.org Swift SDK for Android artifact bundle'
        default: 'https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz'
        required: false
        type: string
      android-sdk-checksum:
        description: 'Checksum for android-sdk-url, as required by `swift sdk install --checksum`'
        default: 'd160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5'
        required: false
        type: string
      android-ndk-version:
        description: 'Android NDK version (LTS r27d or later required) used to configure the SDK bundle'
        default: 'r27d'
        required: false
        type: string

      # ── Step 4: Release Builds ──────────────────────────────
      enable-release-builds:
        description: 'Step 4 – Build package in release mode (-c release) across a Swift version matrix (Linux, build only)'
        default: false
        required: false
        type: boolean
      release-builds-swift-versions:
        description: 'JSON array of Swift versions to build in release mode'
        default: '["6.2", "6.3"]'
        required: false
        type: string

      # ── Step 4: Static SDK ──────────────────────────────────
      enable-static-sdk:
        description: 'Step 4 – Build package against the static Linux SDK (x86_64-swift-linux-musl)'
        default: false
        required: false
        type: boolean
      static-sdk-toolchain-swift-version:
        description: 'Host Swift toolchain version to install (must match the static SDK bundle major.minor)'
        default: '6.3'
        required: false
        type: string
      static-sdk-url:
        description: 'Download URL for the official swift.org static Linux SDK artifact bundle'
        default: 'https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz'
        required: false
        type: string
      static-sdk-checksum:
        description: 'Checksum for static-sdk-url, as required by `swift sdk install --checksum`'
        default: '87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b'
        required: false
        type: string

      # ── Step 5: Coverage Upload ─────────────────────────────
      enable-coverage-upload:
        description: 'Step 5 – Upload coverage to Codecov'
        default: false
        required: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

# Cancel any in-progress or queued run for the same repo + ref when a new
# run is triggered (e.g. new push), so stale xcodebuild/swift test
# processes don't keep running and don't sit blocking the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════
#  HIERARQUIA
#
#  header-validation
#       │
#       ▼
#  format-check
#       │
#       ▼
#  breaking-changes
#       │
#       ├──► apple-tests (matrix)
#       ├──► third-party-tests (matrix)
#       ├──► linkage-test (Linux)
#       │           │
#       │           ▼
#       │     coverage-upload
#       ├──► android-build (Linux, build only)
#       ├──► release-builds (Linux/Windows matrix, build only)
#       └──► static-sdk (Linux musl, build only)
# ═══════════════════════════════════════════════════════════════

jobs:
  # ── STEP 1 ──────────────────────────────────────────────────
  header-validation:
    name: "🪪 Header"
    if: inputs.enable-header-validation
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 5
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 🪪 Check License Header
        env:
          HEADER_TEMPLATE: ${{ inputs.header-template }}
          HEADER_USE_REGEX: ${{ inputs.header-use-regex }}
          HEADER_PATH: ${{ inputs.header-path }}
        run: |
          set -euo pipefail

          if [ -z "$HEADER_TEMPLATE" ]; then
            echo "❌ enable-header-validation is true but header-template is empty"
            exit 1
          fi

          header_lines=()
          while IFS= read -r line || [ -n "$line" ]; do
            header_lines+=("$line")
          done < <(printf '%s' "$HEADER_TEMPLATE")
          line_count=${#header_lines[@]}

          echo "=== Expected header (${line_count} line(s), regex=${HEADER_USE_REGEX}) ==="
          printf '%s\n' "${header_lines[@]}"
          echo "==="

          failures=0
          while IFS= read -r -d '' file; do
            file_lines=()
            while IFS= read -r line || [ -n "$line" ]; do
              file_lines+=("$line")
              if [ "${#file_lines[@]}" -ge "$line_count" ]; then
                break
              fi
            done < "$file"

            ok=true
            for i in "${!header_lines[@]}"; do
              expected="${header_lines[$i]}"
              actual="${file_lines[$i]:-}"
              if [ "$HEADER_USE_REGEX" == "true" ]; then
                if ! [[ "$actual" =~ ^${expected}$ ]]; then
                  ok=false
                  break
                fi
              elif [ "$actual" != "$expected" ]; then
                ok=false
                break
              fi
            done

            if [ "$ok" = false ]; then
              echo "❌ $file"
              failures=$((failures + 1))
            fi
          done < <(find "$HEADER_PATH" -type f -name '*.swift' -not -path '*/.build/*' -not -path '*/.git/*' -print0)

          if [ "$failures" -gt 0 ]; then
            echo ""
            echo "💥 $failures file(s) with missing or invalid license header"
            exit 1
          fi

          echo "✅ All Swift files have a valid license header"

  # ── STEP 2 ──────────────────────────────────────────────────
  format-check:
    name: "🎨 Format"
    needs: header-validation
    if: |
      always() &&
      inputs.enable-format &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped')
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 10
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.format-swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 🎨 Check Formatting
        run: |
          echo "=== Running swift format lint ==="
          if [ -f "${{ inputs.format-config }}" ]; then
            swift format lint --strict --recursive \
              --configuration "${{ inputs.format-config }}" \
              "${{ inputs.format-path }}"
          else
            echo "⚠️  ${{ inputs.format-config }} not found, using defaults"
            swift format lint --strict --recursive "${{ inputs.format-path }}"
          fi
          echo "✅ Formatting check passed"

  # ── STEP 3 ──────────────────────────────────────────────────
  breaking-changes:
    name: "💔 Breaking Changes"
    needs: [header-validation, format-check]
    if: |
      always() &&
      inputs.enable-breaking-changes &&
      !inputs.force-skip-breaking-changes &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      !contains(github.event.pull_request.labels.*.name, 'breaking-changes')
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 15
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-

      - name: 💔 Check API Breaking Changes
        run: |
          # ── Skip on push to main ────────────────────────────
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to main detected, skipping"
            exit 0
          fi

          # ── Detecção automática por major bump ──────────────
          if [ "${{ inputs.skip-on-major-update }}" == "true" ]; then
            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$latest_tag" ]; then
              echo "No tags found, skipping"
              exit 0
            fi
            echo "Latest tag: $latest_tag"

            tag_version="${latest_tag#v}"
            latest_major=$(echo "$tag_version" | cut -d. -f1)
            current_ref="${{ github.ref_name }}"
            ref_version="${current_ref#v}"
            current_major=$(echo "$ref_version" | cut -d. -f1)

            if [[ "$latest_major" =~ ^[0-9]+$ ]] && [[ "$current_major" =~ ^[0-9]+$ ]]; then
              if [ "$latest_major" != "$current_major" ]; then
                echo "⚠️  Major bump detectado ($latest_tag → $current_ref)"
                exit 0
              fi
            fi
          fi

          echo "Checking breaking changes against $latest_tag"
          swift package diagnose-api-breaking-changes "$latest_tag"

  # ── STEP 4A ─────────────────────────────────────────────────
  apple-tests:
    name: "🍎 ${{ matrix.name }}"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-apple-tests &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=iOS Simulator,arch=arm64,name=iPhone 17 Pro,OS=26.5"
            name: "iOS"
          - destination: "platform=iOS Simulator,arch=arm64,name=iPad (A16),OS=26.5"
            name: "iPadOS"
          - destination: "platform=watchOS Simulator,arch=arm64,name=Apple Watch Series 11 (42mm),OS=26.5"
            name: "watchOS"
          - destination: "platform=tvOS Simulator,arch=arm64,name=Apple TV 4K (3rd generation) (at 1080p),OS=26.5"
            name: "tvOS"
          - destination: "platform=visionOS Simulator,arch=arm64,name=Apple Vision Pro,OS=26.5"
            name: "visionOS"
          - destination: "platform=macOS,arch=arm64,name=My Mac"
            name: "macOS"
          - destination: "platform=macOS,arch=arm64,variant=Mac Catalyst,name=My Mac"
            name: "macOS Catalyst"
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 30
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 🍺 Homebrew Dependencies
        run: brew install xcbeautify

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_${{ inputs.xcode-version }}.app

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          # xcodebuild clones package dependencies into DerivedData by
          # default (private per-job, per-destination). Pointing it at a
          # fixed, cached path instead lets every destination in this
          # matrix — and every run — reuse the same cloned sources.
          path: .swiftpm-cache
          key: macOS-clonedSourcePackages-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            macOS-clonedSourcePackages-

      - name: ⚒️ Build Package
        env:
          NSUnbufferedIO: YES
          DEBUG: ${{ inputs.debug }}
        run: |
          set -o pipefail

          # xcbeautify's reformatted output hides exactly what you need when
          # chasing a build failure. `debug` input bypasses it entirely so
          # the raw xcodebuild log reaches the job output instead.
          if [ "$DEBUG" = "true" ]; then
            xcodebuild build-for-testing \
              -scheme "${{ inputs.package-name }}" \
              -destination "${{ matrix.destination }}" \
              -derivedDataPath .xcbuild \
              -clonedSourcePackagesDirPath .swiftpm-cache
          else
            xcodebuild build-for-testing \
              -scheme "${{ inputs.package-name }}" \
              -destination "${{ matrix.destination }}" \
              -derivedDataPath .xcbuild \
              -clonedSourcePackagesDirPath .swiftpm-cache 2>&1 | xcbeautify --quiet --renderer github-actions
          fi

      - name: 🧪 Run Tests with Coverage
        env:
          NSUnbufferedIO: YES
          WORKER_COUNT: ${{ inputs.apple-tests-parallel-testing-worker-count }}
          DEBUG: ${{ inputs.debug }}
        run: |
          # Empty WORKER_COUNT (the default) leaves Xcode's own parallel
          # testing default in place; a value caps simulator worker count,
          # trading job duration for less CPU/scheduler contention on the
          # runner.
          EXTRA_ARGS=()
          if [ -n "$WORKER_COUNT" ]; then
            EXTRA_ARGS+=(-parallel-testing-worker-count "$WORKER_COUNT")
          fi

          set -o pipefail

          # raw-test-output.log is captured either way — the crash-time
          # diagnostic step below depends on it. `debug` input additionally
          # bypasses xcbeautify so the raw log reaches the job output too.
          if [ "$DEBUG" = "true" ]; then
            xcodebuild test-without-building \
              -scheme "${{ inputs.package-name }}" \
              -destination "${{ matrix.destination }}" \
              -enableCodeCoverage YES \
              -derivedDataPath .xcbuild \
              "${EXTRA_ARGS[@]}" 2>&1 | tee raw-test-output.log
          else
            xcodebuild test-without-building \
              -scheme "${{ inputs.package-name }}" \
              -destination "${{ matrix.destination }}" \
              -enableCodeCoverage YES \
              -derivedDataPath .xcbuild \
              "${EXTRA_ARGS[@]}" 2>&1 | tee raw-test-output.log | xcbeautify --renderer github-actions
          fi

      - name: 🚨 Identify Test Running at Crash Time
        if: failure()
        run: |
          python3 - << 'PYEOF'
          import re

          # xcbeautify's pretty output doesn't survive a hard crash (e.g. a
          # `Fatal error` trap) cleanly, making it impossible to tell which
          # test/suite was in flight. The raw xcodebuild log captured above
          # still has every "started"/"passed"/"failed" line, so diff those
          # to find whatever never got a matching completion line — that's
          # the test that was running when the process died.
          #
          # swift-testing (what this repo's suites actually use) prints names
          # unquoted, e.g. `Suite CachedRequestTests started.` and
          # `Test someTest() passed after 0.012 seconds.` — the legacy XCTest
          # phrasing (`Test Case '-[Foo bar]' passed (0.001 seconds)`) always
          # quotes the name. Quotes are optional here so both survive.
          START_RE = re.compile(r"\b(Test Suite|Test Case|Suite|Test)\s+['\"]?(.+?)['\"]?\s+started\b")
          END_RE = re.compile(r"\b(Test Suite|Test Case|Suite|Test)\s+['\"]?(.+?)['\"]?\s+(passed|failed|skipped)\b")

          def is_real_entry(kind, name):
              # swift-testing's top-level "Test run started." / "Test run
              # with N tests passed after Xs." lines aren't a real test —
              # they'd otherwise match as a "Test" named "run" that never
              # closes. Real test identifiers always end in "()".
              return "(" in name if kind in ("Test", "Test Case") else True

          started = {}
          with open("raw-test-output.log") as f:
              for line in f:
                  m = START_RE.search(line)
                  if m and is_real_entry(m.group(1), m.group(2)):
                      started[(m.group(1), m.group(2))] = True
                      continue
                  m = END_RE.search(line)
                  if m and is_real_entry(m.group(1), m.group(2)):
                      started.pop((m.group(1), m.group(2)), None)

          in_flight = [name for (_, name) in started]
          if in_flight:
              print(f"::error::Test(s) still running when the job crashed: {', '.join(in_flight)}")
          else:
              print("No in-flight test could be identified from the raw log "
                    "(crash may have happened outside a test, or the log format didn't match).")
          PYEOF

      - name: 📤 Upload Raw Test Log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-test-log-${{ matrix.name }}
          path: raw-test-output.log

      - name: 🔀 Extract Coverage Report
        if: inputs.apple-coverage-enabled
        run: |
          mkdir -p coverage-artifacts
          XCRESULT_PATH=$(find .xcbuild -name "*.xcresult" -type d | head -n 1)
          if [ -z "$XCRESULT_PATH" ]; then
            echo "❌ No .xcresult found under .xcbuild"
            exit 1
          fi
          echo "Using xcresult: $XCRESULT_PATH"
          # Since Xcode 26, coverage data usually doesn't need a loose
          # .profdata under derived data (.xcbuild); `xccov` can read
          # per-line coverage directly from the .xcresult bundle instead.
          # This is the preferred path when it works.
          #
          # `xccov view --archive` stages its work at a fixed path,
          # /tmp/action.xccovarchive — not under $TMPDIR, and not a
          # per-invocation random one. Setting TMPDIR before the command has
          # no effect on this (confirmed locally: xccov ignores it entirely,
          # and doesn't even touch a pre-existing /tmp/action.xccovarchive
          # when $TMPDIR points elsewhere). On this job's runner, xccov
          # reliably resolves to the literal /tmp, so a leftover/partial
          # /tmp/action.xccovarchive from an earlier failed attempt *in this
          # same job* can make a subsequent attempt fail with
          # "Metadata.plist ... No such file or directory" even though the
          # .xcresult itself is fine. Clear that fixed path before each
          # attempt and retry once.
          #
          # xccov has also been observed to fail outright — independent of
          # /tmp state — on destinations where the .xcresult's test action
          # has no title ("scheme action '(null)'" in the xccov error),
          # which so far has only been seen on native macOS / Mac Catalyst
          # destinations. `xccov view --archive <xcresult>` resolves "the"
          # coverage archive inside the bundle by matching that title, so a
          # null title breaks the lookup even though the underlying coverage
          # data is present and intact.
          extract_coverage() {
            rm -rf /tmp/action.xccovarchive
            xcrun xccov view --archive "$XCRESULT_PATH" > coverage-artifacts/coverage.xccov
          }

          if ! extract_coverage; then
            echo "⚠️  xccov extraction failed, retrying after clearing /tmp/action.xccovarchive..."
            if ! extract_coverage; then
              echo "⚠️  xcrun xccov view --archive failed after retry — will try the xcresulttool export fallback"
            fi
          fi

          # When the title-based lookup above fails, sidestep it by having
          # `xcresulttool export coverage` walk the result bundle's object
          # graph directly (no title matching) and write the raw
          # "*_CoverageArchive" directory straight to disk. Confirmed locally
          # that `xccov view --archive` dispatches on file extension rather
          # than sniffing contents, so the exported directory has to be
          # renamed to end in .xccovarchive before xccov will accept it.
          if [ ! -s coverage-artifacts/coverage.xccov ]; then
            rm -f coverage-artifacts/coverage.xccov
            rm -rf /tmp/xcresult-export
            if xcrun xcresulttool export coverage --path "$XCRESULT_PATH" --output-path /tmp/xcresult-export; then
              EXPORTED_ARCHIVE=$(find /tmp/xcresult-export -mindepth 1 -maxdepth 1 -name "*_CoverageArchive" -type d | head -n 1)
              if [ -n "$EXPORTED_ARCHIVE" ]; then
                RENAMED_ARCHIVE="/tmp/xcresult-export/exported.xccovarchive"
                mv "$EXPORTED_ARCHIVE" "$RENAMED_ARCHIVE"
                if xcrun xccov view --archive "$RENAMED_ARCHIVE" > coverage-artifacts/coverage.xccov; then
                  echo "✅ Extracted coverage via the xcresulttool export fallback"
                else
                  echo "⚠️  xccov also failed against the exported .xccovarchive — will try the .profdata fallback"
                  rm -f coverage-artifacts/coverage.xccov
                fi
              else
                echo "⚠️  xcresulttool export coverage produced no *_CoverageArchive directory — will try the .profdata fallback"
              fi
            else
              echo "⚠️  xcrun xcresulttool export coverage failed — will try the .profdata fallback"
            fi
          fi

          # Last-resort fallback: the same .profdata + .xctest artifacts that
          # third-party-tests uploads for Linux — Coverage Upload already
          # knows how to convert that format (see the 📁 Process Coverage for
          # Each Destination step below), so no downstream change is needed
          # for the fallback to be picked up.
          if [ ! -s coverage-artifacts/coverage.xccov ]; then
            rm -f coverage-artifacts/coverage.xccov
            PROFDATA_FILE=$(find .xcbuild -name "*.profdata" | head -n 1)
            if [ -n "$PROFDATA_FILE" ]; then
              echo "⚠️  Falling back to raw .profdata: $PROFDATA_FILE"
              cp "$PROFDATA_FILE" coverage-artifacts/
              find .xcbuild -name "*.xctest" -type d -exec cp -r {} coverage-artifacts/ \;
            fi
          fi

          # This used to `exit 1` here, but by this point the tests
          # themselves have already passed — only the coverage tooling
          # failed. All 3 plausible extraction paths (xccov's title-based
          # lookup, xcresulttool's object-graph export, and the raw
          # .profdata) were tried against this exact failure in real CI runs
          # and confirmed it's an intermittent Xcode 26 platform bug: the
          # coverage archive object simply isn't materialized for some test
          # actions (content-availability still reports hasCoverage: true,
          # but nothing can extract it). Failing the whole job — including
          # its test results — for a coverage-tooling bug outside our control
          # isn't the right tradeoff, so warn instead and let the job reflect
          # the real test outcome. Coverage Upload is expected to have gaps
          # for this destination when that happens.
          if [ -z "$(find coverage-artifacts -type f -print -quit)" ]; then
            echo "::warning::coverage-artifacts/ is empty for ${{ matrix.name }} — xccov, the xcresulttool export fallback, and the .profdata fallback all produced no data. Tests passed; only coverage extraction failed (likely an intermittent Xcode platform bug). Coverage Upload will be missing this destination."
          fi

      - name: 📤 Upload Coverage Data
        if: inputs.apple-coverage-enabled
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apple-${{ matrix.name }}
          path: coverage-artifacts/

  # ── STEP 4B ─────────────────────────────────────────────────
  third-party-tests:
    name: "🔧 ${{ matrix.name }}"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-third-party-tests &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            name: "Linux"
          # - platform: "windows-latest"
          #   name: "Windows"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-

      - name: ⚒️ Test Package
        run: swift test --enable-code-coverage

      - name: 🔀 Move Coverage Files (Unix)
        if: inputs.third-party-coverage-enabled && (runner.os == 'Linux' || runner.os == 'macOS')
        run: |
          mkdir -p coverage-artifacts
          find .build -name "*.profdata" -exec cp {} coverage-artifacts/ \; 2>/dev/null || true
          find .build -name "*.xctest" -not -path "*/.dSYM/*" -exec cp -r {} coverage-artifacts/ \; 2>/dev/null || true

      - name: 🔀 Move Coverage Files (Windows)
        if: inputs.third-party-coverage-enabled && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "coverage-artifacts" -Force
          Get-ChildItem -Path .build -Recurse -Filter "*.profdata" | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Force
          }
          Get-ChildItem -Path .build -Recurse -Directory -Filter "*.xctest" | Where-Object {
              $_.FullName -notlike "*\.dSYM\*"
          } | ForEach-Object {
              Copy-Item $_.FullName -Destination "coverage-artifacts" -Recurse -Force
          }

      - name: 📤 Upload Artifacts
        if: inputs.third-party-coverage-enabled
        uses: actions/upload-artifact@v7.0.1
        with:
          name: third-party-${{ matrix.name }}
          path: coverage-artifacts/

  # ── STEP 4C: Linkage Test (FoundationEssentials) ───────────
  linkage-test:
    name: "🔗 Linkage Test (FoundationEssentials)"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-linkage-test &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.swift-version }}

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-

      - name: 🔗 Setup Linkage Test Package
        env:
          PKG_NAME: ${{ inputs.name }}
          PROD_NAME: ${{ inputs.product-name != '' && inputs.product-name || inputs.name }}
        run: |
          set -e
          echo "Setting up linkage test for package '$PKG_NAME', product '$PROD_NAME'..."

          mkdir -p Tests/LinkageTest/Sources

          cat > Tests/LinkageTest/Package.swift << EOF
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "linkageTest",
              platforms: [.macOS(.v15)],
              dependencies: [
                  .package(name: "$PKG_NAME", path: "../.."),
              ],
              targets: [
                  .executableTarget(
                      name: "linkageTest",
                      dependencies: [
                          .product(name: "$PROD_NAME", package: "$PKG_NAME"),
                      ]
                  ),
              ]
          )
          EOF

          cat > Tests/LinkageTest/Sources/main.swift << EOF
          import $PROD_NAME

          // This executable only imports the package
          // If the package uses Foundation (not FoundationEssentials),
          // the binary will be linked against libFoundation.so
          print("Linkage test executable")
          EOF

          echo 'Linkage test package created at Tests/LinkageTest/'
          ls -la Tests/LinkageTest/

      - name: ⚒️ Build Linkage Test
        run: |
          cd Tests/LinkageTest
          swift build

      - name: 🔍 Verify Linkage
        run: |
          set -e
          cd Tests/LinkageTest

          # Find the built binary
          BINARY_PATH=$(find .build -name 'linkageTest' -type f -executable | head -n 1)

          if [ -z "$BINARY_PATH" ]; then
            echo '❌ Error: Could not find linkage test binary'
            find .build -type f -executable 2>/dev/null || true
            exit 1
          fi

          echo "✅ Found binary: $BINARY_PATH"
          echo ''
          echo 'LDD output:'
          ldd "$BINARY_PATH"
          echo ''

          # Check if the binary is linked against libFoundation.so
          if ldd "$BINARY_PATH" | grep -q 'libFoundation.so'; then
            echo '❌ FAILURE: Binary is linked against libFoundation.so'
            echo 'This means the package uses Foundation instead of FoundationEssentials'
            echo 'On Linux, this requires importing FoundationNetworking for URLSession APIs'
            exit 1
          else
            echo '✅ SUCCESS: Binary is not linked against libFoundation.so - linkage test passed'
            echo 'The package correctly uses FoundationEssentials'
          fi

  # ── STEP 4D: Android Build ──────────────────────────────────
  android-build:
    name: "🤖 Android"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-android-build &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.android-toolchain-swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-

      - name: 🤖 Install Android Swift SDK + NDK
        run: |
          set -e
          swift sdk install "${{ inputs.android-sdk-url }}" \
            --checksum "${{ inputs.android-sdk-checksum }}"
          swift sdk list

          # The artifact bundle's info.json declares its Swift SDK variant
          # under a "swift-android" relative path, which is where the NDK
          # setup script lives. swift.org's own docs assume it lands at
          # ~/.swiftpm/swift-sdks/<bundle>/swift-android, but on this
          # toolchain that directory doesn't exist at all (confirmed: `find
          # ~/.swiftpm/swift-sdks` itself fails with "No such file or
          # directory") — so rather than guess another fixed base path,
          # search the whole filesystem for wherever `swift sdk install`
          # actually put it.
          SWIFT_ANDROID_DIR=$(find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o -type d -name 'swift-android' -print 2>/dev/null | head -n 1)
          if [ -z "$SWIFT_ANDROID_DIR" ]; then
            echo "❌ Could not locate a 'swift-android' directory anywhere on disk"
            echo "HOME=$HOME"
            env | grep -i swift || true
            find "$HOME" -maxdepth 3
            exit 1
          fi
          echo "Found: $SWIFT_ANDROID_DIR"
          cd "$SWIFT_ANDROID_DIR"

          curl -fSL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${{ inputs.android-ndk-version }}-linux.zip"
          unzip -qo ndk.zip
          export ANDROID_NDK_HOME="$PWD/android-ndk-${{ inputs.android-ndk-version }}"
          ./scripts/setup-android-sdk.sh

      - name: 🤖 Cross-compile for Android
        run: swift build --swift-sdk "${{ inputs.android-swift-sdk }}" --static-swift-stdlib

  # ── STEP 4E: Release Builds ─────────────────────────────────
  release-builds:
    name: "🚀 Release (Swift ${{ matrix.swift-version }})"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-release-builds &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        swift-version: ${{ fromJSON(inputs.release-builds-swift-versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-release-${{ matrix.swift-version }}-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-release-${{ matrix.swift-version }}-
            ${{ runner.os }}-swiftpm-deps-

      - name: 🚀 Build Package (Release)
        run: |
          # Packages commonly have test-support targets (e.g. a shared
          # RequestDLTestSupport-style helper) that use `@testable import`.
          # SwiftPM doesn't enable testability for -c release builds by
          # default, so those targets fail to compile even though they're
          # not part of the shipped product — and which targets actually
          # get pulled into a bare `swift build -c release` isn't reliably
          # scoped by --product/--target across SwiftPM versions. Forcing
          # testability on sidesteps that entirely.
          swift build -c release -Xswiftc -enable-testing

  # ── STEP 4F: Static SDK ─────────────────────────────────────
  static-sdk:
    name: "📦 Static SDK"
    needs: [header-validation, format-check, breaking-changes]
    if: |
      always() &&
      inputs.enable-static-sdk &&
      (needs.header-validation.result == 'success' || needs.header-validation.result == 'skipped') &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (needs.breaking-changes.result == 'success' || needs.breaking-changes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ☑️ Swift Select
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.static-sdk-toolchain-swift-version }}

      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 📦 Cache SwiftPM Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-deps-${{ hashFiles('**/Package*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-deps-

      - name: 📦 Install Static Linux SDK
        run: |
          set -e
          swift sdk install "${{ inputs.static-sdk-url }}" \
            --checksum "${{ inputs.static-sdk-checksum }}"
          swift sdk list

      - name: 📦 Build Package (Static SDK)
        run: swift build --swift-sdk x86_64-swift-linux-musl -Xswiftc -enable-testing

  # ── STEP 5 ──────────────────────────────────────────────────
  coverage-upload:
    name: "📤 Coverage Upload"
    needs: [apple-tests, third-party-tests, linkage-test]
    if: |
      always() &&
      inputs.enable-coverage-upload &&
      (needs.apple-tests.result != 'cancelled' || needs.third-party-tests.result != 'cancelled')
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 15
    steps:
      - name: ⬇️ Get Sources
        uses: actions/checkout@v7.0.1

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: 📁 List Downloaded Artifacts
        run: |
          echo "Artifacts downloaded:"
          ls -la artifacts/
          find artifacts -type d -mindepth 1 -maxdepth 1

      - name: 🔍 Verify Apple Coverage Completeness
        if: inputs.enable-apple-tests && inputs.apple-coverage-enabled
        run: |
          # apple-tests uploads one apple-<name> coverage artifact per
          # matrix leg, but a leg can fail to produce one (e.g. an
          # intermittent Xcode coverage bug, mitigated by warning instead of
          # failing that job) without that being visible here — this job
          # just processes whatever apple-*/ dirs exist. Compare against the
          # matrix's expected platform list so a missing destination shows
          # up as a warning instead of silently reporting fewer coverage
          # numbers to Codecov.
          EXPECTED_PLATFORMS=("iOS" "iPadOS" "watchOS" "tvOS" "visionOS" "macOS" "macOS Catalyst")
          MISSING=()
          for platform in "${EXPECTED_PLATFORMS[@]}"; do
            if [ ! -d "artifacts/apple-${platform}" ]; then
              MISSING+=("$platform")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Missing apple-tests coverage artifact(s) for: ${MISSING[*]} — that destination's apple-tests leg likely failed to extract coverage or didn't run. Codecov numbers for those destinations will be incomplete this run."
          else
            echo "✅ All expected apple-tests coverage artifacts present: ${EXPECTED_PLATFORMS[*]}"
          fi

      - name: ☑️ Xcode Select
        run: sudo xcode-select -switch /Applications/Xcode_${{ inputs.xcode-version }}.app

      - name: 🛠️ Write xccov-to-lcov Converter
        run: |
          cat > /tmp/xccov_to_lcov.py << 'PYEOF'
          import re
          import sys

          HEADER_RE = re.compile(r'^(.+):$')
          DATA_RE = re.compile(r'^(\d+): (\*|\d+)$')


          def convert(input_path, output_path):
              current_file = None
              lines_buffer = []

              def flush(out):
                  if current_file is None:
                      return
                  out.write(f"SF:{current_file}\n")
                  for line_no, count in lines_buffer:
                      out.write(f"DA:{line_no},{count}\n")
                  out.write("end_of_record\n")

              with open(input_path) as f, open(output_path, "w") as out:
                  for raw_line in f:
                      line = raw_line.rstrip("\n")
                      if not line:
                          continue
                      data_match = DATA_RE.match(line)
                      if data_match:
                          if data_match.group(2) != "*":
                              lines_buffer.append((int(data_match.group(1)), int(data_match.group(2))))
                          continue
                      header_match = HEADER_RE.match(line)
                      if header_match:
                          flush(out)
                          current_file = header_match.group(1)
                          lines_buffer = []
                  flush(out)


          if __name__ == "__main__":
              convert(sys.argv[1], sys.argv[2])
          PYEOF

      - name: 📁 Process Coverage for Each Destination
        run: |
          for artifact_dir in artifacts/apple-*/ artifacts/third-party-*/; do
            if [ -d "$artifact_dir" ]; then
              echo "=== Processing: $artifact_dir ==="
              (
                cd "$artifact_dir"
                ARTIFACT_DIR_NAME=$(basename "$artifact_dir")
                OUTPUT_FILE="${{ github.workspace }}/${ARTIFACT_DIR_NAME}.lcov"

                if [ -f "coverage.xccov" ]; then
                  # Artifact from the 🍎 job (Xcode 26+): per-line coverage
                  # extracted from the .xcresult via `xccov view --archive`.
                  python3 /tmp/xccov_to_lcov.py coverage.xccov "$OUTPUT_FILE"
                  echo "Generated: $OUTPUT_FILE"
                else
                  PROFDATA_FILE=$(find . -name "*.profdata" | head -n 1)
                  if [ -z "$PROFDATA_FILE" ]; then
                    echo "No coverage.xccov or .profdata found in $artifact_dir"
                    exit 1
                  fi
                  find . -name "*.xctest" -type d | while read -r xctest_bundle; do
                    if [ -n "$xctest_bundle" ]; then
                      BUNDLE_NAME=$(basename "$xctest_bundle" .xctest)
                      EXECUTABLE_PATH=$(find "$xctest_bundle" -name "$BUNDLE_NAME" -type f -not -path "*/.dSYM/*" | head -n 1)
                      if [ -n "$EXECUTABLE_PATH" ] && [ -f "$EXECUTABLE_PATH" ]; then
                        xcrun llvm-cov export "$EXECUTABLE_PATH" \
                          -format="lcov" \
                          -instr-profile="$PROFDATA_FILE" \
                          -ignore-filename-regex=".build|Tests" > "$OUTPUT_FILE"
                        echo "Generated: $OUTPUT_FILE"
                      fi
                    fi
                  done
                fi
              )
            fi
          done

      - name: 📋 List Generated LCOV Files
        run: ls -la -- *.lcov

      - name: 📦 Upload to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "*.lcov"
          verbose: true